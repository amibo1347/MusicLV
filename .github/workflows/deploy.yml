name: Deploy to OCI

on:
  push:
    branches: [main]
  workflow_dispatch:

# 배포가 겹치면 빌드 중인 jar 를 덮어쓰게 되므로 직렬화한다
concurrency:
  group: deploy-musiclv
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          command_timeout: 20m
          script: /opt/musiclv/deploy.sh
