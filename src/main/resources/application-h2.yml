# MySQL 없이 화면/기능을 확인할 때 쓰는 프로파일.
#   gradlew bootRun --args='--spring.profiles.active=h2'
# 메모리 DB라 종료하면 데이터가 사라진다. 배포에는 절대 쓰지 않는다.
spring:
  datasource:
    url: jdbc:h2:mem:musiclv;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
