spring:
  application:
    name: musiclv

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:musiclv}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:musiclv}
    password: ${DB_PASSWORD:musiclv1234}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # 개발 중에는 update, 운영 배포 시에는 validate 로 바꾼다.
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100

  thymeleaf:
    cache: ${THYMELEAF_CACHE:false}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

server:
  port: ${SERVER_PORT:8080}

  # nginx 뒤에서 돌기 때문에, 원래 요청이 https 였다는 사실을
  # X-Forwarded-* 헤더로 받아야 리다이렉트가 http 로 새지 않는다.
  forward-headers-strategy: framework

# 드럼 시퀀스 451장, 배경 영상, 상품 업로드 이미지가 들어가는 외부 디렉터리.
# jar 에 포함하지 않고 /media/** 로 서빙한다.
musiclv:
  media-dir: ${MEDIA_DIR:./assets}

  # 최초 구동 시 만들어지는 관리자 계정.
  # 외부에 공개되는 환경에서는 ADMIN_PASSWORD 를 반드시 지정한다.
  admin:
    email: ${ADMIN_EMAIL:admin@musiclv.com}
    password: ${ADMIN_PASSWORD:admin1234}

logging:
  level:
    com.musiclv: debug
