<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: commonHead('주문 관리', 'shop')}"></head>

<body>
<header th:replace="~{fragments/layout :: siteHeader('admin')}"></header>

<main class="page">
    <div class="container">
        <div class="section-head">
            <div>
                <h1 class="page-title">주문 관리</h1>
                <p class="page-desc" style="margin:0"
                   th:text="'전체 ' + ${orders.totalElements} + '건의 주문'">0건</p>
            </div>
            <a th:href="@{/admin/products}" class="btn btn-outline">상품 관리</a>
        </div>

        <div th:replace="~{fragments/layout :: flash}"></div>

        <div class="filter-bar">
            <a class="chip" th:classappend="${selectedStatus == null} ? ' active'"
               th:href="@{/admin/orders}">전체</a>
            <a th:each="st : ${statuses}" class="chip"
               th:classappend="${selectedStatus != null and selectedStatus.name == st.name} ? ' active'"
               th:href="@{/admin/orders(status=${st})}" th:text="${st.label}">상태</a>
        </div>

        <div class="table-wrap" th:if="${orders.hasContent()}">
            <table class="table">
                <thead>
                <tr>
                    <th>주문번호</th>
                    <th>주문일시</th>
                    <th>주문자</th>
                    <th>상품</th>
                    <th class="num">결제금액</th>
                    <th class="center">상태</th>
                    <th class="center">상태 변경</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="order : ${orders.content}">
                    <td>
                        <a th:href="@{/orders/{id}(id=${order.id})}" th:text="'#' + ${order.id}">#1</a>
                    </td>
                    <td th:text="${#temporals.format(order.orderedAt, 'yyyy-MM-dd HH:mm')}">-</td>
                    <td>
                        <span th:text="${order.memberName}">이름</span><br>
                        <span class="cart-product-brand" th:text="${order.memberEmail}">이메일</span>
                    </td>
                    <td th:text="${order.summaryName}">-</td>
                    <td class="num" th:text="${#numbers.formatInteger(order.totalAmount, 3, 'COMMA')} + '원'">0원</td>
                    <td class="center">
                        <span class="status" th:classappend="'status-' + ${order.status}"
                              th:text="${order.status.label}">-</span>
                    </td>
                    <td class="center">
                        <form th:action="@{/admin/orders/{id}/status(id=${order.id})}" method="post"
                              style="display:flex; gap:6px; justify-content:center">
                            <select name="status" class="select">
                                <option th:each="st : ${statuses}" th:value="${st}"
                                        th:selected="${st.name == order.status.name}"
                                        th:text="${st.label}">-</option>
                            </select>
                            <button type="submit" class="btn btn-outline btn-sm">변경</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="empty" th:unless="${orders.hasContent()}">
            <p class="empty-title">해당 조건의 주문이 없습니다.</p>
        </div>

        <nav class="pagination" th:if="${orders.totalPages > 1}">
            <a th:if="${!orders.first}"
               th:href="@{/admin/orders(status=${selectedStatus}, page=${orders.number - 1})}">이전</a>
            <span th:unless="${!orders.first}" class="disabled">이전</span>

            <th:block th:each="i : ${#numbers.sequence(0, orders.totalPages - 1)}">
                <span th:if="${i == orders.number}" class="current" th:text="${i + 1}">1</span>
                <a th:unless="${i == orders.number}"
                   th:href="@{/admin/orders(status=${selectedStatus}, page=${i})}" th:text="${i + 1}">1</a>
            </th:block>

            <a th:if="${!orders.last}"
               th:href="@{/admin/orders(status=${selectedStatus}, page=${orders.number + 1})}">다음</a>
            <span th:unless="${!orders.last}" class="disabled">다음</span>
        </nav>
    </div>
</main>

<footer th:replace="~{fragments/layout :: siteFooter}"></footer>
</body>

</html>
