<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: commonHead('공연 관리', null)}"></head>

<body>
<header th:replace="~{fragments/layout :: siteHeader('admin')}"></header>

<main class="page">
    <div class="container">
        <div class="section-head">
            <div>
                <h1 class="page-title">공연 관리</h1>
                <p class="page-desc" style="margin:0"
                   th:text="'전체 ' + ${performances.totalElements} + '개의 공연'">0개</p>
            </div>
            <div style="display:flex; gap:10px; flex-wrap:wrap">
                <a th:href="@{/admin/products}" class="btn btn-outline">상품 관리</a>
                <a th:href="@{/admin/orders}" class="btn btn-outline">주문 관리</a>
                <a th:href="@{/admin/bookings}" class="btn btn-outline">예매 관리</a>
                <a th:href="@{/admin/performances/new}" class="btn btn-primary">+ 공연 등록</a>
            </div>
        </div>

        <div th:replace="~{fragments/layout :: flash}"></div>

        <div class="filter-bar">
            <a class="chip" th:classappend="${selectedCategory == null} ? ' active'"
               th:href="@{/admin/performances(keyword=${keyword})}">전체</a>
            <a th:each="cat : ${categories}" class="chip"
               th:classappend="${selectedCategory != null and selectedCategory.name == cat.name} ? ' active'"
               th:href="@{/admin/performances(keyword=${keyword}, category=${cat})}"
               th:text="${cat.label}">카테고리</a>

            <form class="filter-spacer" th:action="@{/admin/performances}" method="get"
                  style="display:flex; gap:8px">
                <input type="hidden" name="category" th:value="${selectedCategory}">
                <input type="search" name="keyword" class="select" th:value="${keyword}"
                       placeholder="공연명 / 공연장 검색">
                <button type="submit" class="btn btn-outline btn-sm">검색</button>
            </form>
        </div>

        <div class="table-wrap" th:if="${performances.hasContent()}">
            <table class="table">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>공연</th>
                    <th>카테고리</th>
                    <th>공연기간</th>
                    <th class="num">가격</th>
                    <th class="num">잔여</th>
                    <th class="center">관리</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${performances.content}">
                    <td th:text="${p.id}">1</td>
                    <td>
                        <a th:href="@{/tickets/{id}(id=${p.id})}">
                            <span class="cart-product-name" th:text="${p.title}">공연명</span><br>
                            <span class="cart-product-brand" th:text="${p.venue}">공연장</span>
                        </a>
                    </td>
                    <td th:text="${p.category.label}">-</td>
                    <td th:text="${#temporals.format(p.startDate, 'yy.MM.dd')} + ' ~ ' + ${#temporals.format(p.endDate, 'yy.MM.dd')}">-</td>
                    <td class="num" th:text="${#numbers.formatInteger(p.price, 3, 'COMMA')} + '원'">0원</td>
                    <td class="num">
                        <span th:if="${p.closed}" style="color:var(--text-dim)">종료</span>
                        <span th:if="${!p.closed and p.soldOut}" style="color:var(--danger)">매진</span>
                        <span th:if="${!p.closed and !p.soldOut}" th:text="${p.seats}">0</span>
                    </td>
                    <td class="center">
                        <div style="display:flex; gap:6px; justify-content:center">
                            <a th:href="@{/admin/performances/{id}/edit(id=${p.id})}"
                               class="btn btn-outline btn-sm">수정</a>
                            <form th:action="@{/admin/performances/{id}/delete(id=${p.id})}" method="post"
                                  onsubmit="return confirm('이 공연을 삭제하시겠습니까?');">
                                <button type="submit" class="btn btn-danger btn-sm">삭제</button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="empty" th:unless="${performances.hasContent()}">
            <p class="empty-title">등록된 공연이 없습니다.</p>
            <a th:href="@{/admin/performances/new}" class="btn btn-primary">공연 등록하기</a>
        </div>

        <nav class="pagination" th:if="${performances.totalPages > 1}">
            <a th:if="${!performances.first}"
               th:href="@{/admin/performances(keyword=${keyword}, category=${selectedCategory}, page=${performances.number - 1})}">이전</a>
            <span th:unless="${!performances.first}" class="disabled">이전</span>
            <th:block th:each="i : ${#numbers.sequence(0, performances.totalPages - 1)}">
                <span th:if="${i == performances.number}" class="current" th:text="${i + 1}">1</span>
                <a th:unless="${i == performances.number}"
                   th:href="@{/admin/performances(keyword=${keyword}, category=${selectedCategory}, page=${i})}"
                   th:text="${i + 1}">1</a>
            </th:block>
            <a th:if="${!performances.last}"
               th:href="@{/admin/performances(keyword=${keyword}, category=${selectedCategory}, page=${performances.number + 1})}">다음</a>
            <span th:unless="${!performances.last}" class="disabled">다음</span>
        </nav>
    </div>
</main>

<footer th:replace="~{fragments/layout :: siteFooter}"></footer>
</body>

</html>
