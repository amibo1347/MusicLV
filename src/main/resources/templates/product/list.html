<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: commonHead('MusicStore', null)}"></head>

<body>
<header th:replace="~{fragments/layout :: siteHeader('store')}"></header>

<main class="page">
    <div class="container">

        <h1 class="page-title" th:if="${keyword == null or keyword.isEmpty()}">MusicStore</h1>
        <h1 class="page-title" th:unless="${keyword == null or keyword.isEmpty()}"
            th:text="'\'' + ${keyword} + '\' 검색 결과'">검색 결과</h1>
        <p class="page-desc" th:text="'전체 ' + ${products.totalElements} + '개의 상품'">0개</p>

        <div th:replace="~{fragments/layout :: flash}"></div>

        <!-- 카테고리 + 정렬 -->
        <div class="filter-bar">
            <a class="chip" th:classappend="${selectedCategory == null} ? ' active'"
               th:href="@{/products(keyword=${keyword}, sort=${sort})}">전체</a>
            <a th:each="cat : ${categories}" class="chip"
               th:classappend="${selectedCategory != null and selectedCategory.name == cat.name} ? ' active'"
               th:href="@{/products(keyword=${keyword}, category=${cat}, sort=${sort})}"
               th:text="${cat.label}">카테고리</a>

            <form class="filter-spacer" th:action="@{/products}" method="get">
                <input type="hidden" name="keyword" th:value="${keyword}">
                <input type="hidden" name="category" th:value="${selectedCategory}">
                <select name="sort" class="select" onchange="this.form.submit()">
                    <option value="new" th:selected="${sort == 'new'}">최신순</option>
                    <option value="priceAsc" th:selected="${sort == 'priceAsc'}">낮은 가격순</option>
                    <option value="priceDesc" th:selected="${sort == 'priceDesc'}">높은 가격순</option>
                    <option value="name" th:selected="${sort == 'name'}">이름순</option>
                </select>
            </form>
        </div>

        <!-- 목록 -->
        <div class="product-grid" th:if="${products.hasContent()}">
            <th:block th:each="product : ${products.content}">
                <div th:replace="~{fragments/layout :: productCard(${product})}"></div>
            </th:block>
        </div>

        <div class="empty" th:unless="${products.hasContent()}">
            <p class="empty-title">조건에 맞는 상품이 없습니다.</p>
            <a th:href="@{/products}" class="btn btn-outline">전체 상품 보기</a>
        </div>

        <!-- 페이지네이션 -->
        <nav class="pagination" th:if="${products.totalPages > 1}">
            <a th:if="${!products.first}"
               th:href="@{/products(keyword=${keyword}, category=${selectedCategory}, sort=${sort}, page=${products.number - 1})}">이전</a>
            <span th:unless="${!products.first}" class="disabled">이전</span>

            <th:block th:each="i : ${#numbers.sequence(0, products.totalPages - 1)}">
                <span th:if="${i == products.number}" class="current" th:text="${i + 1}">1</span>
                <a th:unless="${i == products.number}"
                   th:href="@{/products(keyword=${keyword}, category=${selectedCategory}, sort=${sort}, page=${i})}"
                   th:text="${i + 1}">1</a>
            </th:block>

            <a th:if="${!products.last}"
               th:href="@{/products(keyword=${keyword}, category=${selectedCategory}, sort=${sort}, page=${products.number + 1})}">다음</a>
            <span th:unless="${!products.last}" class="disabled">다음</span>
        </nav>

    </div>
</main>

<footer th:replace="~{fragments/layout :: siteFooter}"></footer>
</body>

</html>
